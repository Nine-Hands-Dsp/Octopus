name: Build Windows + macOS
on:
  push:
  workflow_dispatch:
jobs:
  win:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Octopus-VST3-Windows
          path: build/Octopus_artefacts/Release/VST3/

  mac:
    runs-on: macos-15-intel     # macos-14 retiré le 2 novembre 2026 ; les Mac arm64 de GitHub sont saturés (jobs jamais pris en charge)
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Sign (ad-hoc) and zip
        run: |
          mkdir -p out
          for b in build/Octopus_artefacts/VST3/*.vst3 build/Octopus_artefacts/Release/VST3/*.vst3; do
            [ -e "$b" ] || continue
            codesign --force --deep --sign - "$b"
            ditto "$b" "out/$(basename "$b")"
          done
          cd out && ls -la
      - name: Upload macOS plugin
        uses: actions/upload-artifact@v4
        with:
          name: Octopus-macOS-VST3
          path: out/

  # pont REAPER testé contre une API de REAPER simulée (tools/reaper_sim)
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev
          git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE.git ../JUCE
      - name: Build and run REAPER bridge tests
        run: |
          cmake -S tools/reaper_sim -B simbuild -DJUCE_DIR=$PWD/../JUCE -DCMAKE_BUILD_TYPE=Release
          cmake --build simbuild --parallel 4
          ./simbuild/OctopusReaperSim_artefacts/Release/OctopusReaperSim

  # Publie la version (tag v<VERSION de CMakeLists>) en Release GitHub, fichiers a nom fixe :
  # les boutons du README (.../releases/latest/download/Octopus-VST3-<OS>.zip) suivent chaque version.
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [win, mac, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import re;print(re.search(r'^project\s*\(\s*\w+[^)]*?VERSION\s+([0-9.]+)',open('CMakeLists.txt').read(),re.M).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: Octopus-VST3-Windows
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: Octopus-macOS-VST3
          path: dist/mac
      - name: Archives
        run: |
          pack() {
            src="$1"; out="$GITHUB_WORKSPACE/$2"; wrap="$3"
            n=$(ls -A "$src" | wc -l); z=$(ls "$src"/*.zip 2>/dev/null | head -1)
            if [ "$n" = 1 ] && [ -n "$z" ]; then cp "$z" "$out"
            elif [ -n "$wrap" ]; then mkdir -p "pk/$wrap" && cp -a "$src"/. "pk/$wrap/" && (cd pk && zip -r -q -y "$out" "$wrap") && rm -rf pk
            else (cd "$src" && zip -r -q -y "$out" .); fi
          }
          pack dist/win "Octopus-VST3-Windows.zip" ""
          pack dist/mac "Octopus-VST3-macOS.zip" ""
          ls -l *.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          FILES="Octopus-VST3-Windows.zip Octopus-VST3-macOS.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --latest --title "OCTOPUS $TAG" --notes "Installation : voir le README (Windows : C:\Program Files\Common Files\VST3 ; macOS : ~/Library/Audio/Plug-Ins/VST3)."
          fi
